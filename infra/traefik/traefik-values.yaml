deployment:
    replicas: 1
providers:
    kubernetesGateway:
        enabled: true
    kubernetesCRD:
        enabled: true
gateway:
    enabled: true
    name: traefik
    namespace: traefik
    annotations:
        cert-manager.io/issuer: lolcathost.online-issuer
    listeners:
        web:
            port: 80
            protocol: HTTP
            namespacePolicy:
                from: All
        websecure-cloud:
            hostname: cloud.lolcathost.online
            port: 443
            protocol: HTTPS
            namespacePolicy:
                from: All
            mode: Terminate
            certificateRefs:
                - name: cloud.lolcathost.online-tls
        websecure-head:
            hostname: head.lolcathost.online
            port: 443
            protocol: HTTPS
            namespacePolicy:
                from: All
            mode: Terminate
            certificateRefs:
                - name: head.lolcathost.online-tls


gatewayClass:
    enabled: true
    name: traefik
ports:
    web:
        port: 80
    websecure:
        port: 443
service:
    type: LoadBalancer
    spec:
        # TODO: read up on this, maybe revert this and use Forwarded-For or the likes
        externalTrafficPolicy: Local
    annotations:
        metallb.io/loadBalancerIPs: 192.168.176.231 #,fd00:1234::231