apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: traefik
    namespace: flux-system
spec:
    interval: 1h
    url: https://helm.traefik.io/traefik

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik
    namespace: traefik
spec:
    interval: 1h
    chart:
        spec:
            chart: traefik
            sourceRef:
                kind: HelmRepository
                name: traefik
                namespace: flux-system
            version: 39.0.0
    valuesFrom:
        - kind: ConfigMap
          name: traefik-values
          valuesKey: values.yaml
