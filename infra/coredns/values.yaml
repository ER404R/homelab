isClusterService: false

serviceType: "LoadBalancer"
service:
    type: LoadBalancer
    annotations:
        metallb.io/loadBalancerIPs: 192.168.176.230 #,fd00:1234::230

servers:
    - zones:
        - zone: homelab
          use_tcp: true
      port: 53
      
      plugins:
        - name: errors
        - name: health
          configBlock: |-
            lameduck 10s
        - name: ready
        - name: template IN A
          configBlock: |-
            match ^(.+)\.homelab\.$
            answer "{{.Name}} 60 IN A 192.168.176.231"
        - name: template IN AAAA
          configBlock: |-
            match ^(.+)\.homelab\.$
            answer "{{.Name}} 60 IN AAAA fd00:1234::231"
        - name: cache
          parameters: 60
        - name: reload
    - zones:
          - zone: .
            use_tcp: true
      port: 53
      plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: hosts
            configBlock: |-
              192.168.176.220 jellyfin lan.jellyfin
              fallthrough
          - name: forward
            parameters: . 1.1.1.1 8.8.8.8 2606:4700:4700::1111 2001:4860:4860::8888
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
