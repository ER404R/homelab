apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: sonarr
  namespace: flux-system
spec:
  image: lscr.io/linuxserver/sonarr
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: sonarr
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sonarr
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)\.\d+-ls\d+$'
    extract: '$version'
  policy:
    semver:
      range: '>=4.0.0 <5.0.0'
