apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  image: lscr.io/linuxserver/sabnzbd
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sabnzbd
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)-ls\d+$'
    extract: '$version'
  policy:
    semver:
      range: '>=5.0.0 <6.0.0'
