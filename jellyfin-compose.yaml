services:
    jellyfin:
        image: jellyfin/jellyfin:latest
        container_name: jellyfin
        environment:
            - PUID=${USER_ID}
            - PGID=${GROUP_ID}
            - TZ=Europe/Berlin
        network_mode: "host"
        volumes:
            - ${CONFIG_PATH}/jellyfin/config:/config
            - ${CONFIG_PATH}/jellyfin/cache:/cache
            - type: bind
              source: ${DATA_PATH}/media
              target: /media
              read_only: true
        restart: "${RESTART_POLICY}"

    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: sonarr
        environment:
            - PUID=${USER_ID}
            - PGID=${GROUP_ID}
            - TZ=Europe/Berlin
        volumes:
            - ${CONFIG_PATH}/sonarr/config:/config
            - ${DATA_PATH}:/data # this dir shall contain movies, tv, and so on subdirs
        ports:
            - 8989:8989
        restart: "${RESTART_POLICY}"

    radarr:
        image: lscr.io/linuxserver/radarr:latest
        container_name: radarr
        environment:
            - PUID=${USER_ID}
            - PGID=${GROUP_ID}
            - TZ=Europe/Berlin
        volumes:
            - ${CONFIG_PATH}/radarr/config:/config
            - ${DATA_PATH}:/data # this dir shall contain movies, tv, and so on subdirs
        ports:
            - 7878:7878
        restart: "${RESTART_POLICY}"

    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        container_name: prowlarr
        environment:
            - PUID=${USER_ID}
            - PGID=${GROUP_ID}
            - TZ=Europe/Berlin
        volumes:
            - ${CONFIG_PATH}/prowlarr/config:/config
        ports:
            - 9696:9696
        restart: "${RESTART_POLICY}"

    sabnzbd:
        image: lscr.io/linuxserver/sabnzbd:latest
        container_name: sabnzbd
        environment:
            - PUID=${USER_ID}
            - PGID=${GROUP_ID}
            - TZ=Europe/Berlin
        volumes:
            - ${CONFIG_PATH}/sabnzbd/config:/config
            - ${DATA_PATH}/usenet:/data/usenet
        ports:
            - 8080:8080
            - 9090:9090
        restart: "${RESTART_POLICY}"
